networks:
  warrior_internal_net:
    driver: bridge

volumes:
  pgdata:
  uploads_data:

services:
  # CSDL PostgreSQL (Tầng 3: Lưu trữ dữ liệu quan hệ 3NF & Session)
  postgres_db:
    image: postgres:16-alpine
    container_name: warrior_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-db_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-warrior_hub_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - warrior_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-db_admin} -d ${POSTGRES_DB:-warrior_hub_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Công cụ GUI Quản trị Cơ sở Dữ liệu pgAdmin 4
  pgadmin:
    image: dpage/pgadmin4
    container_name: warrior_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@warrior.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_secure_pass}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - warrior_internal_net

  # Backend REST API Service (Tầng 2: Nghiệp vụ & Knex Query Builder)
  backend_api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: warrior_backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: postgres://${POSTGRES_USER:-db_admin}:${POSTGRES_PASSWORD:-secure_password_2026}@postgres_db:5432/${POSTGRES_DB:-warrior_hub_db}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-super_secret_token_key_2026}
      NODE_ENV: production
    volumes:
      - ./backend-api/src:/app/src
      - uploads_data:/app/uploads
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - warrior_internal_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Frontend SSR Web Server (Tầng 1: Render HTML Handlebars + Tailwind shadcn)
  frontend_ssr:
    build:
      context: ./frontend-ssr
      dockerfile: Dockerfile
    container_name: warrior_frontend
    restart: always
    environment:
      PORT: 3000
      BACKEND_API_URL: http://backend_api:5000/api/v1
      SESSION_SECRET: ${SESSION_SECRET:-warrior_hub_session_secret_2026}
      NODE_ENV: production
    volumes:
      - ./frontend-ssr/src:/app/src
      - ./frontend-ssr/public:/app/public
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend_api:
        condition: service_healthy
    networks:
      - warrior_internal_net
